info:
  name: ResetPassword
  type: grpc
  seq: 20

grpc:
  url: "{{AUTH_GRPC_URL}}"
  method: /auth.AuthService/ResetPassword
  methodType: unary
  protoFilePath: ../../../app/proto/auth.proto
  message:
    - title: message 1
      message: |-
        {
          "email": "{{USER_EMAIL}}",
          "token": "token-from-email",
          "newPassword": "{{USER_PASSWORD}}",
          "newPasswordConfirmation": "{{USER_PASSWORD}}",
          "session": {
            "device": "{{USER_DEVICE}}",
            "ip": "{{USER_IP}}",
            "os": "{{USER_OS}}",
            "browser": "{{USER_BROWSER}}"
          }
        }
  auth: inherit
