syntax = 'proto3';

import 'auth/authorization.proto';
import 'shared/shared.proto';

package auth;

service AuthService {
  rpc Register (authorization.RegisterInput) returns (authorization.AuthOutput);
  rpc Login (authorization.LoginInput) returns (authorization.AuthOutput);
  rpc Refresh (authorization.RefreshInput) returns (authorization.AuthOutput);
  rpc Logout (authorization.RefreshInput) returns (shared.Empty);
  rpc Validate (authorization.ValidateInput) returns (authorization.UserPayload);
  rpc ForgotPassword (authorization.ForgotPasswordInput) returns (shared.Empty);
  rpc ResetPassword (authorization.ResetPasswordInput) returns (shared.Empty);
  rpc GetMe (authorization.ValidateInput) returns (authorization.UserEntity);
}