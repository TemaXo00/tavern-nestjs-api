syntax = "proto3";

package authorization;

enum Roles {
  USER = 0;
  ADMIN = 1;
  MODERATOR = 2;
}

// Input Messages

message RegisterInput {
  string email = 1;
  string password = 2;
  string passwordConfirmation = 3;
}

message LoginInput {
  string email = 1;
  string password = 2;
}

message RefreshInput {
  string refreshToken = 1;
}

message ValidateInput {
  string accessToken = 1;
}

message ChangePasswordInput {
  string oldPassword = 1;
  string newPassword = 2;
  string newPasswordConfirmation = 3;
}

message ForgotPasswordInput {
  string email = 1;
}

message ResetPasswordInput {
  string token = 1;
  string newPassword = 2;
  string newPasswordConfirmation = 3;
}

// Output Messages

message AuthOutput {
  string accessToken = 1;
  string refreshToken = 2;
}

message UserPayload {
  string id = 1;
  string sessionId = 2;
  Roles role = 3;
}

message UserEntity {
  string id = 1;
  string email = 2;
  Roles role = 3;
  bool isActive = 4;
  string sessionId = 5;
  string sessionName = 6;
}