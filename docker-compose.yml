services:
  rabbitmq:
    image: rabbitmq:4.2.4-alpine
    container_name: tavern-rmq
    ports:
      - "${TAVERN_RMQ_PORT}:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${TAVERN_RMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${TAVERN_RMQ_PASSWORD}
    healthcheck:
      test: [ "CMD", "rabbitmqctl", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6.5-alpine
    container_name: tavern-redis
    ports:
      - "${TAVERN_REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory-policy allkeys-lru
      --requirepass ${TAVERN_REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-db:
    image: postgres:18.4-alpine
    container_name: tavern-auth-db
    environment:
      POSTGRES_DB: ${TAVERN_AUTH_DB_NAME}
      POSTGRES_USER: ${TAVERN_AUTH_DB_USER}
      POSTGRES_PASSWORD: ${TAVERN_AUTH_DB_PASSWORD}
    ports:
      - "${TAVERN_DB_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${TAVERN_AUTH_DB_USER} -d ${TAVERN_AUTH_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - auth_db_data:/var/lib/postrgesql

volumes:
  redis_data:
  auth_db_data: